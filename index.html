<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>CaliRecomp Studio</title>
  
  <!-- Native Full-Screen Mobile PWA Meta Tags (Hides Browser Bar) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CaliRecomp" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#020617" />

  <!-- Inline Web App Manifest for Android "Install App" -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"CaliRecomp Studio","short_name":"CaliRecomp","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#020617","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"512x512","type":"image/png"}]}' />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png" />

  <!-- Tailwind CSS & React via CDN (Zero Build Step Needed!) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const getExercisePool = (level, eq) => {
      const push = {
        beginner: [
          { id: 'push_1', name: 'Incline Push-ups', next: 'Standard Push-ups', cue: 'Hands elevated. Core braced.' },
          { id: 'push_2', name: 'Knee Pike Push-ups', next: 'Strict Pike Push-ups', cue: 'Hips high in V-shape.' },
          { id: 'push_3', name: 'Bench Dips', next: 'Straight-Leg Dips', cue: 'Lower until elbows hit 90°.' }
        ],
        intermediate: [
          { id: 'push_1', name: 'Tempo Push-ups', next: 'Archer Push-ups', cue: '3s down, chest grazes floor.' },
          { id: 'push_2', name: 'Pike Push-ups', next: 'Elevated Pike Push-ups', cue: 'Load anterior deltoids.' },
          { id: 'push_3', name: 'Diamond Push-ups', next: 'Bar / Ring Dips', cue: 'Index & thumbs touching.' }
        ],
        advanced: [
          { id: 'push_1', name: 'Archer Push-ups', next: 'One-Arm Progression', cue: '80% load on working arm.' },
          { id: 'push_2', name: 'Wall HSPU', next: 'Freestanding HSPU', cue: 'Strict vertical stack.' },
          { id: 'push_3', name: 'Pseudo Planche Push-ups', next: 'Tuck Planche Push-ups', cue: 'Lean shoulders past wrists.' }
        ]
      };

      const pull = {
        beginner: eq === 'none' ? [
          { id: 'pull_1', name: 'Towel Doorframe Rows', next: 'Single-Arm Towel Rows', cue: 'Lean back, pull chest to hands.' },
          { id: 'pull_2', name: 'Prone Floor Cobras', next: 'Floor Pull-downs', cue: 'Squeeze scapula & lift chest.' }
        ] : [
          { id: 'pull_1', name: 'Australian Rows', next: 'Elevated Rows', cue: 'Pull low bar to sternum.' },
          { id: 'pull_2', name: 'Negative Pull-ups (5s)', next: 'Strict Pull-ups', cue: 'Jump to top, lower slowly.' }
        ],
        intermediate: eq === 'none' ? [
          { id: 'pull_1', name: 'Single-Arm Towel Rows', next: 'Explosive Rows', cue: 'Resist trunk rotation.' },
          { id: 'pull_2', name: 'Sliding Floor Pull-downs', next: 'Isometric Towel Hold', cue: 'Pull body forward with lats.' }
        ] : [
          { id: 'pull_1', name: 'Strict Pull-ups', next: 'Chest-to-Bar Pull-ups', cue: 'Dead hang to chin over bar.' },
          { id: 'pull_2', name: 'Feet-Elevated Rows', next: 'Archer Rows', cue: 'Pause 1s at top.' }
        ],
        advanced: eq === 'none' ? [
          { id: 'pull_1', name: 'Explosive Single-Arm Rows', next: 'Front Lever Tuck Rows', cue: 'Max concentric speed.' },
          { id: 'pull_2', name: 'Isometric Towel Hold', next: 'One-Arm Eccentrics', cue: '90° elbow lock.' }
        ] : [
          { id: 'pull_1', name: 'L-Sit Pull-ups', next: 'Muscle-up Progression', cue: 'Legs horizontal, chest to bar.' },
          { id: 'pull_2', name: 'Archer Pull-ups', next: 'One-Arm Eccentrics', cue: 'Traverse side-to-side.' }
        ]
      };

      const legs = {
        beginner: [
          { id: 'leg_1', name: 'Bulgarian Split Squats', next: 'Assisted Pistol Squats', cue: 'Rear foot elevated on chair.' },
          { id: 'leg_2', name: 'Single-Leg Glute Bridges', next: 'Nordic Eccentrics', cue: 'Drive through heel.' }
        ],
        intermediate: [
          { id: 'leg_1', name: 'Assisted Pistol Squats', next: 'Strict Pistol Squats', cue: 'Control knee tracking.' },
          { id: 'leg_2', name: 'Nordic Hamstring Curls', next: 'Full Nordic Curls', cue: 'Fight gravity on the way down.' }
        ],
        advanced: [
          { id: 'leg_1', name: 'Strict Pistol Squats', next: 'Weighted Pistols', cue: 'Full depth below parallel.' },
          { id: 'leg_2', name: 'Sissy Squats', next: 'Matrix Squats', cue: 'Rigid line from knees to shoulders.' }
        ]
      };

      const core = {
        beginner: [{ id: 'core_1', name: 'Hollow Body Tuck Hold', next: 'Full Hollow Hold', cue: 'Lower back glued to floor.' }],
        intermediate: [{ id: 'core_1', name: 'Hanging Leg Raises', next: 'Toes-to-Bar', cue: 'Curl pelvis up, no swinging.' }],
        advanced: [{ id: 'core_1', name: 'Floor L-Sit / Dragon Flags', next: 'V-Sit Hold', cue: 'Full core compression.' }]
      };

      return { push: push[level], pull: pull[level], legs: legs[level], core: core[level] };
    };

    function App() {
      const [activeTab, setActiveTab] = useState('workout');
      const [activeWeek, setActiveWeek] = useState(1);
      const [selectedDayIdx, setSelectedDayIdx] = useState(0);
      const [syncStatus, setSyncStatus] = useState('');
      const fileInputRef = useRef(null);

      const [profile, setProfile] = useState(() => {
        const s = localStorage.getItem('cali_profile_v3');
        return s ? JSON.parse(s) : {
          age: 32, weightKg: 78, heightCm: 178, gender: 'male',
          level: 'intermediate', durationMonths: 2, daysPerWeek: 4,
          equipment: 'pullup_bar', primaryGoal: 'recomp'
        };
      });

      const [workoutLogs, setWorkoutLogs] = useState(() => {
        const s = localStorage.getItem('cali_logs_v3');
        return s ? JSON.parse(s) : {};
      });

      const [biometrics, setBiometrics] = useState(() => {
        const s = localStorage.getItem('cali_bio_v3');
        return s ? JSON.parse(s) : [
          { week: 1, date: new Date().toISOString().slice(0, 10), weightKg: 78, waistCm: 86, maxPullups: 6, maxPushups: 20 }
        ];
      });

      const [cloudConfig, setCloudConfig] = useState(() => {
        const s = localStorage.getItem('cali_cloud_v3');
        return s ? JSON.parse(s) : {
          mode: 'local', supabaseUrl: '', supabaseAnonKey: '', syncId: 'my-cali-recomp-2026'
        };
      });

      useEffect(() => { localStorage.setItem('cali_profile_v3', JSON.stringify(profile)); }, [profile]);
      useEffect(() => { localStorage.setItem('cali_logs_v3', JSON.stringify(workoutLogs)); }, [workoutLogs]);
      useEffect(() => { localStorage.setItem('cali_bio_v3', JSON.stringify(biometrics)); }, [biometrics]);
      useEffect(() => { localStorage.setItem('cali_cloud_v3', JSON.stringify(cloudConfig)); }, [cloudConfig]);

      const [timerSec, setTimerSec] = useState(60);
      const [timerActive, setTimerActive] = useState(false);

      useEffect(() => {
        let interval;
        if (timerActive && timerSec > 0) {
          interval = setInterval(() => setTimerSec((s) => s - 1), 1000);
        } else if (timerSec === 0) {
          setTimerActive(false);
        }
        return () => clearInterval(interval);
      }, [timerActive, timerSec]);

      const exportToPhoneFile = () => {
        const payload = { profile, workoutLogs, biometrics, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cali-recomp-backup-wk${activeWeek}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setSyncStatus('Saved backup file to your phone!');
      };

      const importFromPhoneFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.profile) setProfile(data.profile);
            if (data.workoutLogs) setWorkoutLogs(data.workoutLogs);
            if (data.biometrics) setBiometrics(data.biometrics);
            setSyncStatus('Restored data from file!');
          } catch {
            setSyncStatus('Invalid backup file.');
          }
        };
        reader.readAsText(file);
      };

      const syncWithCloud = async (direction) => {
        if (!cloudConfig.supabaseUrl || !cloudConfig.supabaseAnonKey || !cloudConfig.syncId) {
          setSyncStatus('Enter Cloud URL, Key, and Sync ID first.');
          return;
        }
        setSyncStatus(direction === 'push' ? 'Uploading...' : 'Downloading...');
        const endpoint = `${cloudConfig.supabaseUrl.replace(/\/$/, '')}/rest/v1/cali_backups`;
        const headers = {
          'apikey': cloudConfig.supabaseAnonKey,
          'Authorization': `Bearer ${cloudConfig.supabaseAnonKey}`,
          'Content-Type': 'application/json',
          'Prefer': 'resolution=merge-duplicates'
        };
        try {
          if (direction === 'push') {
            const res = await fetch(endpoint, {
              method: 'POST', headers,
              body: JSON.stringify({ sync_id: cloudConfig.syncId, payload: { profile, workoutLogs, biometrics }, updated_at: new Date().toISOString() })
            });
            if (!res.ok) throw new Error();
            setSyncStatus(`Synced to Cloud at ${new Date().toLocaleTimeString()}`);
          } else {
            const res = await fetch(`${endpoint}?sync_id=eq.${encodeURIComponent(cloudConfig.syncId)}&select=payload`, { headers });
            const rows = await res.json();
            if (rows.length > 0 && rows[0].payload) {
              setProfile(rows[0].payload.profile);
              setWorkoutLogs(rows[0].payload.workoutLogs);
              setBiometrics(rows[0].payload.biometrics);
              setSyncStatus('Pulled latest workout logs from Cloud!');
            } else {
              setSyncStatus('No record found for that Sync ID.');
            }
          }
        } catch {
          setSyncStatus('Cloud sync error. Verify credentials.');
        }
      };

      const nutrition = useMemo(() => {
        const bmr = profile.gender === 'male'
          ? 10 * profile.weightKg + 6.25 * profile.heightCm - 5 * profile.age + 5
          : 10 * profile.weightKg + 6.25 * profile.heightCm - 5 * profile.age - 161;
        const tdee = Math.round(bmr * (profile.daysPerWeek === 3 ? 1.45 : 1.55));
        const targetCalories = Math.round(tdee * (profile.primaryGoal === 'fat_loss' ? 0.78 : 0.85));
        const proteinGrams = Math.round(profile.weightKg * 2.1);
        return { targetCalories, proteinGrams };
      }, [profile]);

      const pool = useMemo(() => getExercisePool(profile.level, profile.equipment), [profile.level, profile.equipment]);
      const totalWeeks = profile.durationMonths * 4;
      const isShredPhase = activeWeek > totalWeeks / 2;
      const setsCount = profile.level === 'beginner' ? 3 : 4;
      const targetMin = isShredPhase ? 12 : 8;
      const targetMax = isShredPhase ? 16 : 12;
      const restSec = isShredPhase ? 45 : 70;

      const days = useMemo(() => [
        {
          dayNumber: 1, title: 'Push + Core Compression',
          exercises: [
            { ...pool.push[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.push[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.push[2], sets: setsCount - 1, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 30, max: 45, unit: 'sec' }
          ],
          finisher: '4 Rounds Tabata (20s ON / 10s OFF): Mountain Climbers'
        },
        {
          dayNumber: 2, title: 'Pull + HIIT Fat Oxidation',
          exercises: [
            { ...pool.pull[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.pull[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 30, max: 45, unit: 'sec' }
          ],
          finisher: '5-Min AMRAP: 5 Pulls + 10 Push-ups + 15 Squats'
        },
        {
          dayNumber: 3, title: 'Legs + Explosive Core',
          exercises: [
            { ...pool.legs[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.legs[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 35, max: 50, unit: 'sec' }
          ],
          finisher: 'EMOM 6 Mins: 12 Jump Squats + Wall Sit'
        },
        {
          dayNumber: 4, title: 'Full-Body Antagonist Supersets',
          exercises: [
            { ...pool.push[0], id: 'ss_push', name: `A1: ${pool.push[0].name}`, sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.pull[0], id: 'ss_pull', name: `A2: ${pool.pull[0].name}`, sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.legs[0], id: 'ss_leg', name: `B1: ${pool.legs[0].name}`, sets: 3, min: targetMin, max: targetMax, unit: 'reps' }
          ],
          finisher: '3 Rounds: 45s High Knees / 15s Rest'
        }
      ].slice(0, profile.daysPerWeek), [pool, setsCount, targetMin, targetMax, profile.daysPerWeek]);

      const activeDay = days[selectedDayIdx] || days[0];
      const logSet = (exId, sIdx, val) => setWorkoutLogs((p) => ({ ...p, [`w${activeWeek}-d${activeDay.dayNumber}-${exId}-s${sIdx}`]: Math.max(0, val) }));
      const getSet = (w, d, exId, sIdx) => workoutLogs[`w${w}-d${d}-${exId}-s${sIdx}`] ?? 0;

      const [newBio, setNewBio] = useState({ weightKg: profile.weightKg, waistCm: 84, maxPullups: 8, maxPushups: 25 });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 select-none">
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div>
              <h1 className="text-sm font-extrabold text-white flex items-center gap-1.5">
                🔥 CaliRecomp
                <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400">
                  {cloudConfig.mode === 'cloud' ? 'Cloud' : 'Local'}
                </span>
              </h1>
              <p className="text-[11px] text-slate-400">{nutrition.targetCalories} kcal • {nutrition.proteinGrams}g Protein</p>
            </div>
            <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-2.5 py-1.5 rounded-xl">
              <span className="font-mono text-xs font-bold w-10 text-center text-emerald-400">
                {Math.floor(timerSec / 60)}:{String(timerSec % 60).padStart(2, '0')}
              </span>
              <button onClick={() => setTimerActive(!timerActive)} className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-xs font-bold">
                {timerActive ? '||' : '▶'}
              </button>
              <button onClick={() => { setTimerActive(false); setTimerSec(restSec); }} className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-xs">
                ↺
              </button>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pt-4 space-y-4">
            {activeTab === 'workout' && (
              <>
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                  {Array.from({ length: totalWeeks }).map((_, i) => (
                    <button key={i} onClick={() => setActiveWeek(i + 1)} className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 border ${activeWeek === i + 1 ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                      Wk {i + 1}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-4 gap-1.5">
                  {days.map((d, idx) => (
                    <button key={d.dayNumber} onClick={() => setSelectedDayIdx(idx)} className={`py-2 rounded-xl text-xs font-bold border ${selectedDayIdx === idx ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                      Day {d.dayNumber}
                    </button>
                  ))}
                </div>

                <div className="space-y-3">
                  {activeDay.exercises.map((ex) => {
                    const curVol = Array.from({ length: ex.sets }).reduce((a, _, s) => a + getSet(activeWeek, activeDay.dayNumber, ex.id, s), 0);
                    const prevVol = activeWeek > 1 ? Array.from({ length: ex.sets }).reduce((a, _, s) => a + getSet(activeWeek - 1, activeDay.dayNumber, ex.id, s), 0) : 0;
                    const unlocked = Array.from({ length: ex.sets }).every((_, s) => getSet(activeWeek, activeDay.dayNumber, ex.id, s) >= ex.max);

                    return (
                      <div key={ex.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div className="flex justify-between">
                          <div>
                            <h3 className="text-sm font-bold text-white">{ex.name}</h3>
                            <p className="text-[11px] text-slate-400">{ex.cue}</p>
                          </div>
                          <button onClick={() => { setTimerSec(restSec); setTimerActive(true); }} className="text-[11px] bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-lg text-emerald-400 font-semibold">
                            {ex.min}–{ex.max} {ex.unit}
                          </button>
                        </div>

                        <div className="grid grid-cols-4 gap-2 pt-2 border-t border-slate-800">
                          {Array.from({ length: ex.sets }).map((_, sIdx) => {
                            const val = getSet(activeWeek, activeDay.dayNumber, ex.id, sIdx);
                            return (
                              <div key={sIdx} className="flex flex-col">
                                <span className="text-[10px] text-slate-400 mb-1 text-center">Set {sIdx + 1}</span>
                                <input type="number" inputMode="numeric" placeholder="0" value={val || ''} onChange={(e) => logSet(ex.id, sIdx, Number(e.target.value))} className={`w-full text-center py-2 rounded-xl text-sm font-bold border outline-none ${val >= ex.min ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-white'}`} />
                              </div>
                            );
                          })}
                        </div>

                        <div className="flex justify-between text-[11px] text-slate-400">
                          <span>Total: <strong className="text-white">{curVol} {ex.unit}</strong></span>
                          {activeWeek > 1 && prevVol > 0 && (
                            <span className={curVol >= prevVol ? 'text-emerald-400 font-semibold' : 'text-amber-400'}>
                              {curVol >= prevVol ? `+${curVol - prevVol}` : curVol - prevVol} vs Wk {activeWeek - 1}
                            </span>
                          )}
                        </div>

                        {unlocked && (
                          <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2 text-[11px] text-emerald-300 flex justify-between">
                            <span>🏆 Unlock Next:</span>
                            <strong className="text-white">{ex.next}</strong>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const entry = { week: activeWeek, date: new Date().toISOString().slice(0, 10), ...newBio };
                  setBiometrics((prev) => [...prev.filter((b) => b.week !== activeWeek), entry].sort((a, b) => a.week - b.week));
                }} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-xs font-bold uppercase text-emerald-400">Log Week {activeWeek} Check-In</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    <input type="number" step="0.1" placeholder="Weight (kg)" value={newBio.weightKg} onChange={(e) => setNewBio({ ...newBio, weightKg: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" step="0.5" placeholder="Waist (cm)" value={newBio.waistCm} onChange={(e) => setNewBio({ ...newBio, waistCm: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" placeholder="Max Pull-ups" value={newBio.maxPullups} onChange={(e) => setNewBio({ ...newBio, maxPullups: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" placeholder="Max Push-ups" value={newBio.maxPushups} onChange={(e) => setNewBio({ ...newBio, maxPushups: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl">Save Check-In</button>
                </form>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
                  <h3 className="text-xs font-bold uppercase text-slate-400">Recomp Log</h3>
                  {biometrics.map((b) => (
                    <div key={b.week} className="py-2 border-b border-slate-800 flex justify-between text-xs">
                      <span className="font-bold text-emerald-400">Wk {b.week}</span>
                      <span>{b.weightKg}kg • {b.waistCm}cm • {b.maxPullups} Pull / {b.maxPushups} Push</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'storage' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-sm font-bold text-white">Select Storage Location</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button onClick={() => setCloudConfig({ ...cloudConfig, mode: 'local' })} className={`p-3 rounded-xl border text-left ${cloudConfig.mode === 'local' ? 'bg-emerald-500/15 border-emerald-500' : 'bg-slate-950 border-slate-800'}`}>
                      <div className="text-xs font-bold">📱 Local Phone</div>
                      <div className="text-[10px] text-slate-400">Offline + File Export</div>
                    </button>
                    <button onClick={() => setCloudConfig({ ...cloudConfig, mode: 'cloud' })} className={`p-3 rounded-xl border text-left ${cloudConfig.mode === 'cloud' ? 'bg-emerald-500/15 border-emerald-500' : 'bg-slate-950 border-slate-800'}`}>
                      <div className="text-xs font-bold">☁️ Cloud Sync</div>
                      <div className="text-[10px] text-slate-400">Supabase REST Sync</div>
                    </button>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold uppercase text-slate-300">Save / Load Phone Backup File</h3>
                  <div className="grid grid-cols-2 gap-2.5">
                    <button onClick={exportToPhoneFile} className="py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs font-bold">⬇ Export .JSON</button>
                    <button onClick={() => fileInputRef.current?.click()} className="py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs font-bold">⬆ Import .JSON</button>
                    <input ref={fileInputRef} type="file" accept=".json" onChange={importFromPhoneFile} className="hidden" />
                  </div>
                </div>

                {cloudConfig.mode === 'cloud' && (
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5">
                    <input type="text" placeholder="Supabase URL" value={cloudConfig.supabaseUrl} onChange={(e) => setCloudConfig({ ...cloudConfig, supabaseUrl: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                    <input type="password" placeholder="Supabase Anon Key" value={cloudConfig.supabaseAnonKey} onChange={(e) => setCloudConfig({ ...cloudConfig, supabaseAnonKey: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                    <input type="text" placeholder="Sync ID" value={cloudConfig.syncId} onChange={(e) => setCloudConfig({ ...cloudConfig, syncId: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <button onClick={() => syncWithCloud('push')} className="py-2 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl">Push to Cloud</button>
                      <button onClick={() => syncWithCloud('pull')} className="py-2 bg-sky-500 text-slate-950 font-bold text-xs rounded-xl">Pull from Cloud</button>
                    </div>
                  </div>
                )}
                {syncStatus && <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-300">{syncStatus}</div>}
              </div>
            )}

            {activeTab === 'setup' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h2 className="text-sm font-bold text-white">Athlete & Program Setup</h2>
                <div className="grid grid-cols-2 gap-3">
                  <select value={profile.durationMonths} onChange={(e) => { setProfile({ ...profile, durationMonths: Number(e.target.value) }); setActiveWeek(1); }} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-bold">
                    <option value={2}>2 Months (8 Wks)</option>
                    <option value={4}>4 Months (16 Wks)</option>
                  </select>
                  <select value={profile.level} onChange={(e) => setProfile({ ...profile, level: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-bold">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                  </select>
                  <select value={profile.equipment} onChange={(e) => setProfile({ ...profile, equipment: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-bold">
                    <option value="pullup_bar">Pull-up Bar</option>
                    <option value="none">Zero Equipment</option>
                  </select>
                  <select value={profile.daysPerWeek} onChange={(e) => setProfile({ ...profile, daysPerWeek: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs font-bold">
                    <option value={3}>3 Days / Week</option>
                    <option value={4}>4 Days / Week</option>
                  </select>
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 inset-x-0 z-30 bg-slate-900/95 border-t border-slate-800 px-2 py-2">
            <div className="max-w-lg mx-auto grid grid-cols-4 gap-1">
              {[
                { id: 'workout', label: '⚡ Workout' },
                { id: 'analytics', label: '📈 Progress' },
                { id: 'storage', label: '💾 Storage' },
                { id: 'setup', label: '⚙️ Setup' }
              ].map((t) => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`py-2 rounded-xl text-xs font-bold ${activeTab === t.id ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
