<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>CaliRecomp Pro Ultimate</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CaliRecomp" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png" />

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const speakText = (text) => {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    };

    // --- FULL-BODY ANIMATED STICKFIGURE CANVAS COMPONENT ---
    function FullBodyAnimator({ category }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let progress = 0;

        const render = () => {
          progress += 0.03;
          const cycle = Math.sin(progress); // oscillates between -1 and 1

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = '#34d399'; // Emerald glowing color
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          const cx = canvas.width / 2;
          const cy = canvas.height / 2;

          ctx.save();
          if (category === 'Push') {
            // Push-up animation (Body lowers and rises)
            const bodyDrop = cycle * 12;
            ctx.beginPath();
            // Head
            ctx.arc(cx - 35, cy - 10 + bodyDrop * 0.5, 6, 0, Math.PI * 2);
            // Spine / Torso
            ctx.moveTo(cx - 30, cy - 5 + bodyDrop * 0.7);
            ctx.lineTo(cx + 20, cy + 5 + bodyDrop);
            // Arms (bending elbows)
            ctx.moveTo(cx - 20, cy + bodyDrop * 0.8);
            ctx.lineTo(cx - 10, cy + 25);
            ctx.lineTo(cx + 5, cy + 25 + bodyDrop * 0.5);
            // Legs
            ctx.moveTo(cx + 20, cy + 5 + bodyDrop);
            ctx.lineTo(cx + 50, cy + 25);
            ctx.stroke();
          } else if (category === 'Pull') {
            // Pull-up animation (Body hangs and pulls up)
            const pullUp = Math.abs(cycle) * 18;
            ctx.beginPath();
            // Bar at top
            ctx.moveTo(cx - 40, cy - 25);
            ctx.lineTo(cx + 40, cy - 25);
            // Hands on bar
            ctx.moveTo(cx - 15, cy - 25);
            ctx.lineTo(cx - 15, cy - 10 - pullUp);
            ctx.moveTo(cx + 15, cy - 25);
            ctx.lineTo(cx + 15, cy - 10 - pullUp);
            // Body hanging / pulling up
            ctx.moveTo(cx, cy - 10 - pullUp);
            ctx.lineTo(cx, cy + 15 - pullUp); // Torso
            ctx.arc(cx, cy - 18 - pullUp, 6, 0, Math.PI * 2); // Head
            // Legs hanging
            ctx.moveTo(cx, cy + 15 - pullUp);
            ctx.lineTo(cx - 5, cy + 38);
            ctx.stroke();
          } else if (category === 'Legs') {
            // Squat animation
            const squatDepth = Math.abs(cycle) * 15;
            ctx.beginPath();
            // Head
            ctx.arc(cx, cy - 20 - squatDepth * 0.5, 6, 0, Math.PI * 2);
            // Torso
            ctx.moveTo(cx, cy - 14 - squatDepth * 0.5);
            ctx.lineTo(cx, cy + 5 - squatDepth);
            // Legs bending
            ctx.moveTo(cx, cy + 5 - squatDepth);
            ctx.lineTo(cx - 15, cy + 15);
            ctx.lineTo(cx - 10, cy + 32);
            ctx.moveTo(cx, cy + 5 - squatDepth);
            ctx.lineTo(cx + 15, cy + 15);
            ctx.lineTo(cx + 10, cy + 32);
            ctx.stroke();
          } else if (category === 'Run') {
            // Running stickfigure stride animation
            const legSwing = cycle * 15;
            ctx.beginPath();
            // Head
            ctx.arc(cx + cycle * 5, cy - 15, 6, 0, Math.PI * 2);
            // Torso leaning forward
            ctx.moveTo(cx, cy - 10);
            ctx.lineTo(cx + 5, cy + 10);
            // Legs running stride
            ctx.moveTo(cx + 5, cy + 10);
            ctx.lineTo(cx - 15 + legSwing, cy + 32);
            ctx.moveTo(cx + 5, cy + 10);
            ctx.lineTo(cx + 25 - legSwing, cy + 32);
            ctx.stroke();
          } else {
            // Core / Plank animation
            ctx.beginPath();
            ctx.arc(cx - 35, cy, 6, 0, Math.PI * 2); // Head
            ctx.moveTo(cx - 30, cy + 3);
            ctx.lineTo(cx + 30, cy + 3); // Rigid plank torso
            ctx.moveTo(cx - 20, cy + 3);
            ctx.lineTo(cx - 15, cy + 25); // Arms
            ctx.moveTo(cx + 25, cy + 3);
            ctx.lineTo(cx + 40, cy + 25); // Legs
            ctx.stroke();
          }
          ctx.restore();

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, [category]);

      return (
        <div className="w-full h-28 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center my-2 relative overflow-hidden">
          <canvas ref={canvasRef} width={200} height={90} className="w-full h-20" />
          <span className="text-[10px] text-emerald-400 font-mono pb-1 uppercase tracking-wider">Full-Body Form Animation ({category})</span>
        </div>
      );
    }

    const getExercisePool = (level, eq) => {
      const push = {
        beginner: [
          { id: 'push_1', name: 'Incline Push-ups', category: 'Push', next: 'Standard Push-ups', cue: 'Hands elevated. Core braced.' },
          { id: 'push_2', name: 'Knee Pike Push-ups', category: 'Push', next: 'Strict Pike Push-ups', cue: 'Hips high in V-shape.' },
          { id: 'push_3', name: 'Bench Dips', category: 'Push', next: 'Straight-Leg Dips', cue: 'Lower until elbows hit 90°.' }
        ],
        intermediate: [
          { id: 'push_1', name: 'Tempo Push-ups', category: 'Push', next: 'Archer Push-ups', cue: '3s down, chest grazes floor.' },
          { id: 'push_2', name: 'Pike Push-ups', category: 'Push', next: 'Elevated Pike Push-ups', cue: 'Load anterior deltoids.' },
          { id: 'push_3', name: 'Diamond Push-ups', category: 'Push', next: 'Bar / Ring Dips', cue: 'Index & thumbs touching.' }
        ],
        advanced: [
          { id: 'push_1', name: 'Archer Push-ups', category: 'Push', next: 'One-Arm Progression', cue: '80% load on working arm.' },
          { id: 'push_2', name: 'Wall HSPU', category: 'Push', next: 'Freestanding HSPU', cue: 'Strict vertical stack.' },
          { id: 'push_3', name: 'Pseudo Planche Push-ups', category: 'Push', next: 'Tuck Planche Push-ups', cue: 'Lean shoulders past wrists.' }
        ]
      };

      const pull = {
        beginner: eq === 'none' ? [
          { id: 'pull_1', name: 'Towel Doorframe Rows', category: 'Pull', next: 'Single-Arm Towel Rows', cue: 'Lean back, pull chest to hands.' },
          { id: 'pull_2', name: 'Prone Floor Cobras', category: 'Pull', next: 'Floor Pull-downs', cue: 'Squeeze scapula & lift chest.' }
        ] : [
          { id: 'pull_1', name: 'Australian Rows', category: 'Pull', next: 'Elevated Rows', cue: 'Pull low bar to sternum.' },
          { id: 'pull_2', name: 'Negative Pull-ups (5s)', category: 'Pull', next: 'Strict Pull-ups', cue: 'Jump to top, lower slowly.' }
        ],
        intermediate: eq === 'none' ? [
          { id: 'pull_1', name: 'Single-Arm Towel Rows', category: 'Pull', next: 'Explosive Rows', cue: 'Resist trunk rotation.' },
          { id: 'pull_2', name: 'Sliding Floor Pull-downs', category: 'Pull', next: 'Isometric Towel Hold', cue: 'Pull body forward with lats.' }
        ] : [
          { id: 'pull_1', name: 'Strict Pull-ups', category: 'Pull', next: 'Chest-to-Bar Pull-ups', cue: 'Dead hang to chin over bar.' },
          { id: 'pull_2', name: 'Feet-Elevated Rows', category: 'Pull', next: 'Archer Rows', cue: 'Pause 1s at top.' }
        ],
        advanced: eq === 'none' ? [
          { id: 'pull_1', name: 'Explosive Single-Arm Rows', category: 'Pull', next: 'Front Lever Tuck Rows', cue: 'Max concentric speed.' },
          { id: 'pull_2', name: 'Isometric Towel Hold', category: 'Pull', next: 'One-Arm Eccentrics', cue: '90° elbow lock.' }
        ] : [
          { id: 'pull_1', name: 'L-Sit Pull-ups', category: 'Pull', next: 'Muscle-up Progression', cue: 'Legs horizontal, chest to bar.' },
          { id: 'pull_2', name: 'Archer Pull-ups', category: 'Pull', next: 'One-Arm Eccentrics', cue: 'Traverse side-to-side.' }
        ]
      };

      const legs = {
        beginner: [
          { id: 'leg_1', name: 'Bulgarian Split Squats', category: 'Legs', next: 'Assisted Pistol Squats', cue: 'Rear foot elevated on chair.' },
          { id: 'leg_2', name: 'Single-Leg Glute Bridges', category: 'Legs', next: 'Nordic Eccentrics', cue: 'Drive through heel.' }
        ],
        intermediate: [
          { id: 'leg_1', name: 'Assisted Pistol Squats', category: 'Legs', next: 'Strict Pistol Squats', cue: 'Control knee tracking.' },
          { id: 'leg_2', name: 'Nordic Hamstring Curls', category: 'Legs', next: 'Full Nordic Curls', cue: 'Fight gravity on the way down.' }
        ],
        advanced: [
          { id: 'leg_1', name: 'Strict Pistol Squats', category: 'Legs', next: 'Weighted Pistols', cue: 'Full depth below parallel.' },
          { id: 'leg_2', name: 'Sissy Squats', category: 'Legs', next: 'Matrix Squats', cue: 'Rigid line from knees to shoulders.' }
        ]
      };

      const core = {
        beginner: [{ id: 'core_1', name: 'Hollow Body Tuck Hold', category: 'Core', next: 'Full Hollow Hold', cue: 'Lower back glued to floor.' }],
        intermediate: [{ id: 'core_1', name: 'Hanging Leg Raises', category: 'Core', next: 'Toes-to-Bar', cue: 'Curl pelvis up, no swinging.' }],
        advanced: [{ id: 'core_1', name: 'Floor L-Sit / Dragon Flags', category: 'Core', next: 'V-Sit Hold', cue: 'Full core compression.' }]
      };

      return { push: push[level], pull: pull[level], legs: legs[level], core: core[level] };
    };

    function App() {
      const [activeTab, setActiveTab] = useState('workout');
      const [activeWeek, setActiveWeek] = useState(1);
      const [selectedDayIdx, setSelectedDayIdx] = useState(0);
      const [syncStatus, setSyncStatus] = useState('');
      const fileInputRef = useRef(null);
      const photoInputRef = useRef(null);

      const [profile, setProfile] = useState(() => {
        const s = localStorage.getItem('cali_profile_v7');
        return s ? JSON.parse(s) : {
          age: 32, weightKg: 78, heightCm: 178, gender: 'male',
          level: 'intermediate', durationMonths: 2, daysPerWeek: 4,
          equipment: 'pullup_bar', primaryGoal: 'recomp'
        };
      });

      const [workoutLogs, setWorkoutLogs] = useState(() => {
        const s = localStorage.getItem('cali_logs_v7');
        return s ? JSON.parse(s) : {};
      });

      const [biometrics, setBiometrics] = useState(() => {
        const s = localStorage.getItem('cali_bio_v7');
        return s ? JSON.parse(s) : [
          { week: 1, date: new Date().toISOString().slice(0, 10), weightKg: 78, waistCm: 86, maxPullups: 6, maxPushups: 20 }
        ];
      });

      const [foodLogs, setFoodLogs] = useState(() => {
        const s = localStorage.getItem('cali_food_v7');
        return s ? JSON.parse(s) : [];
      });

      const [runLogs, setRunLogs] = useState(() => {
        const s = localStorage.getItem('cali_run_v7');
        return s ? JSON.parse(s) : [];
      });

      const [progressPhotos, setProgressPhotos] = useState(() => {
        const s = localStorage.getItem('cali_photos_v7');
        return s ? JSON.parse(s) : [];
      });

      const [hydrationDrankMl, setHydrationDrankMl] = useState(1500);
      const [watchData, setWatchData] = useState({ connected: false, device: 'None', heartRate: 72, caloriesBurned: 340, steps: 6420 });

      useEffect(() => { localStorage.setItem('cali_profile_v7', JSON.stringify(profile)); }, [profile]);
      useEffect(() => { localStorage.setItem('cali_logs_v7', JSON.stringify(workoutLogs)); }, [workoutLogs]);
      useEffect(() => { localStorage.setItem('cali_bio_v7', JSON.stringify(biometrics)); }, [biometrics]);
      useEffect(() => { localStorage.setItem('cali_food_v7', JSON.stringify(foodLogs)); }, [foodLogs]);
      useEffect(() => { localStorage.setItem('cali_run_v7', JSON.stringify(runLogs)); }, [runLogs]);
      useEffect(() => { localStorage.setItem('cali_photos_v7', JSON.stringify(progressPhotos)); }, [progressPhotos]);

      const [timerSec, setTimerSec] = useState(60);
      const [timerActive, setTimerActive] = useState(false);

      useEffect(() => {
        let interval;
        if (timerActive && timerSec > 0) {
          interval = setInterval(() => setTimerSec((s) => s - 1), 1000);
        } else if (timerSec === 0 && timerActive) {
          setTimerActive(false);
          speakText('Rest timer finished. Time for your next set!');
        }
        return () => clearInterval(interval);
      }, [timerActive, timerSec]);

      const metrics = useMemo(() => {
        const heightM = profile.heightCm / 100;
        const bmi = heightM > 0 ? (profile.weightKg / (heightM * heightM)).toFixed(1) : 0;
        let bmiCategory = 'Normal weight';
        if (bmi < 18.5) bmiCategory = 'Underweight';
        else if (bmi >= 25 && bmi < 30) bmiCategory = 'Overweight';
        else if (bmi >= 30) bmiCategory = 'Obese';

        const bmr = profile.gender === 'male'
          ? (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) + 5
          : (10 * profile.weightKg) + (6.25 * profile.heightCm) - (5 * profile.age) - 161;

        const tdee = Math.round(bmr * (profile.daysPerWeek === 3 ? 1.45 : profile.daysPerWeek === 4 ? 1.55 : 1.65));
        const baseTargetCalories = Math.round(tdee * (profile.primaryGoal === 'fat_loss' ? 0.78 : 0.85));

        const todayStr = new Date().toISOString().slice(0, 10);
        const todayFoodCalories = foodLogs.filter(f => f.date === todayStr).reduce((a, b) => a + b.calories, 0);
        const todayRunCalories = runLogs.filter(r => r.date === todayStr).reduce((a, b) => a + b.caloriesBurned, 0);

        const proteinGrams = Math.round(profile.weightKg * 2.1);
        const fatGrams = Math.round((baseTargetCalories * 0.25) / 9);
        const carbGrams = Math.max(50, Math.round((baseTargetCalories - (proteinGrams * 4 + fatGrams * 9)) / 4));
        const waterTargetMl = Math.round(profile.weightKg * 35);

        return { bmi, bmiCategory, bmr: Math.round(bmr), tdee, baseTargetCalories, todayFoodCalories, todayRunCalories, proteinGrams, fatGrams, carbGrams, waterTargetMl };
      }, [profile, foodLogs, runLogs]);

      const pool = useMemo(() => getExercisePool(profile.level, profile.equipment), [profile.level, profile.equipment]);
      const totalWeeks = profile.durationMonths * 4;
      const isShredPhase = activeWeek > totalWeeks / 2;
      const setsCount = profile.level === 'beginner' ? 3 : 4;
      const targetMin = isShredPhase ? 12 : 8;
      const targetMax = isShredPhase ? 16 : 12;
      const restSec = isShredPhase ? 45 : 70;

      // --- RUNNING IS NOW PLACED FIRST ON EVERY WORKOUT DAY ---
      const days = useMemo(() => [
        {
          dayNumber: 1, title: 'Run + Push & Core',
          exercises: [
            { id: 'run_d1', name: 'Endurance Fat-Loss Run (30 min)', category: 'Run', next: 'Interval Sprints', cue: 'Zone 2 steady-state cardiovascular conditioning.', sets: 1, min: 30, max: 35, unit: 'mins' },
            { ...pool.push[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.push[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 30, max: 45, unit: 'sec' }
          ],
          finisher: '4 Rounds Tabata (20s ON / 10s OFF): Mountain Climbers'
        },
        {
          dayNumber: 2, title: 'Run + Pull & HIIT',
          exercises: [
            { id: 'run_d2', name: 'Recovery Run / Jog (25 min)', category: 'Run', next: 'Speed Intervals', cue: 'Maintain comfortable nasal breathing pace.', sets: 1, min: 25, max: 30, unit: 'mins' },
            { ...pool.pull[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.pull[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 30, max: 45, unit: 'sec' }
          ],
          finisher: '5-Min AMRAP: 5 Pulls + 10 Push-ups + 15 Squats'
        },
        {
          dayNumber: 3, title: 'Run + Legs & Core',
          exercises: [
            { id: 'run_d3', name: 'Interval / Hill Run (25 min)', category: 'Run', next: 'Long Endurance Run', cue: 'Alternate 1 min fast sprint with 2 mins jogging.', sets: 1, min: 25, max: 30, unit: 'mins' },
            { ...pool.legs[0], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.legs[1], sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.core[0], sets: 3, min: 35, max: 50, unit: 'sec' }
          ],
          finisher: 'EMOM 6 Mins: 12 Jump Squats + Wall Sit'
        },
        {
          dayNumber: 4, title: 'Run + Full-Body Supersets',
          exercises: [
            { id: 'run_d4', name: 'Tempo Run (30 min)', category: 'Run', next: 'Marathon Prep', cue: 'Challenging but sustainable aerobic threshold pace.', sets: 1, min: 30, max: 35, unit: 'mins' },
            { ...pool.push[0], id: 'ss_push', name: `A1: ${pool.push[0].name}`, sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.pull[0], id: 'ss_pull', name: `A2: ${pool.pull[0].name}`, sets: setsCount, min: targetMin, max: targetMax, unit: 'reps' },
            { ...pool.legs[0], id: 'ss_leg', name: `B1: ${pool.legs[0].name}`, sets: 3, min: targetMin, max: targetMax, unit: 'reps' }
          ],
          finisher: '3 Rounds: 45s High Knees / 15s Rest'
        }
      ].slice(0, profile.daysPerWeek), [pool, setsCount, targetMin, targetMax, profile.daysPerWeek]);

      const activeDay = days[selectedDayIdx] || days[0];
      const logSet = (exId, sIdx, val) => setWorkoutLogs((p) => ({ ...p, [`w${activeWeek}-d${activeDay.dayNumber}-${exId}-s${sIdx}`]: Math.max(0, val) }));
      const getSet = (w, d, exId, sIdx) => workoutLogs[`w${w}-d${d}-${exId}-s${sIdx}`] ?? 0;

      const [newFood, setNewFood] = useState({ name: 'Grilled Chicken & Rice', calories: 520 });
      const [newRun, setNewRun] = useState({ distanceKm: 5, paceMinKm: 5.5 });
      const [newBio, setNewBio] = useState({ weightKg: profile.weightKg, waistCm: 84, maxPullups: 8, maxPushups: 25 });

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-24 select-none">
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div>
              <h1 className="text-sm font-extrabold text-white flex items-center gap-1.5">
                🔥 CaliRecomp Pro
                <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400">BMI: {metrics.bmi}</span>
              </h1>
              <p className="text-[11px] text-slate-400">Net Deficit: {metrics.tdee - metrics.todayFoodCalories + metrics.todayRunCalories} kcal</p>
            </div>
            <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-2.5 py-1.5 rounded-xl">
              <span className="font-mono text-xs font-bold w-10 text-center text-emerald-400">
                {Math.floor(timerSec / 60)}:{String(timerSec % 60).padStart(2, '0')}
              </span>
              <button onClick={() => setTimerActive(!timerActive)} className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-xs font-bold">
                {timerActive ? '||' : '▶'}
              </button>
              <button onClick={() => { setTimerActive(false); setTimerSec(restSec); }} className="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-xs">↺</button>
            </div>
          </header>

          <main className="max-w-lg mx-auto px-4 pt-4 space-y-4">
            {activeTab === 'workout' && (
              <>
                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
                  {Array.from({ length: totalWeeks }).map((_, i) => (
                    <button key={i} onClick={() => setActiveWeek(i + 1)} className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 border ${activeWeek === i + 1 ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                      Wk {i + 1}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-4 gap-1.5">
                  {days.map((d, idx) => (
                    <button key={d.dayNumber} onClick={() => setSelectedDayIdx(idx)} className={`py-2 rounded-xl text-xs font-bold border ${selectedDayIdx === idx ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                      Day {d.dayNumber}
                    </button>
                  ))}
                </div>

                <div className="space-y-4">
                  {activeDay.exercises.map((ex) => {
                    const curVol = Array.from({ length: ex.sets }).reduce((a, _, s) => a + getSet(activeWeek, activeDay.dayNumber, ex.id, s), 0);
                    const unlocked = Array.from({ length: ex.sets }).every((_, s) => getSet(activeWeek, activeDay.dayNumber, ex.id, s) >= ex.max);

                    return (
                      <div key={ex.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                        <div className="flex justify-between">
                          <div>
                            <span className="text-[10px] font-bold uppercase tracking-wider text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-md mb-1 inline-block">
                              {ex.category === 'Run' ? '🏃‍♂️ First Exercise: Running Session' : `🏋️ Calisthenics (${ex.category})`}
                            </span>
                            <h3 className="text-sm font-bold text-white">{ex.name}</h3>
                            <p className="text-[11px] text-slate-400">{ex.cue}</p>
                          </div>
                        </div>

                        {/* LIVE FULL-BODY ANIMATION */}
                        <FullBodyAnimator category={ex.category || 'Push'} />

                        <div className="grid grid-cols-4 gap-2 pt-2 border-t border-slate-800">
                          {Array.from({ length: ex.sets }).map((_, sIdx) => {
                            const val = getSet(activeWeek, activeDay.dayNumber, ex.id, sIdx);
                            return (
                              <div key={sIdx} className="flex flex-col">
                                <span className="text-[10px] text-slate-400 mb-1 text-center">{ex.category === 'Run' ? 'Completed' : `Set ${sIdx + 1}`}</span>
                                <input type="number" inputMode="numeric" placeholder="0" value={val || ''} onChange={(e) => logSet(ex.id, sIdx, Number(e.target.value))} className={`w-full text-center py-2 rounded-xl text-sm font-bold border outline-none ${val >= ex.min ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-950 border-slate-800 text-white'}`} />
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}

            {activeTab === 'nutrition' && (
              <div className="space-y-4">
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const burn = Math.round(newRun.distanceKm * profile.weightKg * 1.03);
                  setRunLogs(prev => [{ date: new Date().toISOString().slice(0, 10), caloriesBurned: burn, ...newRun }, ...prev]);
                }} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold uppercase text-sky-400">Log Running Session (First Priority)</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="number" step="0.1" placeholder="Distance (km)" value={newRun.distanceKm} onChange={(e) => setNewRun({...newRun, distanceKm: Number(e.target.value)})} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" />
                    <input type="number" step="0.1" placeholder="Pace (min/km)" value={newRun.paceMinKm} onChange={(e) => setNewRun({...newRun, paceMinKm: Number(e.target.value)})} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>
                  <button type="submit" className="w-full py-2 bg-sky-500 text-slate-950 font-bold text-xs rounded-xl">Log Run (+Exact Weight Calorie Burn)</button>
                </form>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  setFoodLogs(prev => [{ date: new Date().toISOString().slice(0, 10), ...newFood }, ...prev]);
                }} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h3 className="text-xs font-bold uppercase text-emerald-400">Log Food Intake</h3>
                  <div className="grid grid-cols-3 gap-2">
                    <input type="text" placeholder="Meal Name" value={newFood.name} onChange={(e) => setNewFood({...newFood, name: e.target.value})} className="col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs" />
                    <input type="number" placeholder="Calories" value={newFood.calories} onChange={(e) => setNewFood({...newFood, calories: Number(e.target.value)})} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" />
                  </div>
                  <button type="submit" className="w-full py-2 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl">Add Food Item</button>
                </form>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const entry = { week: activeWeek, date: new Date().toISOString().slice(0, 10), ...newBio };
                  setBiometrics((prev) => [...prev.filter((b) => b.week !== activeWeek), entry].sort((a, b) => a.week - b.week));
                  setProfile(p => ({...p, weightKg: newBio.weightKg}));
                }} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <h2 className="text-xs font-bold uppercase text-emerald-400">Log Week {activeWeek} Check-In</h2>
                  <div className="grid grid-cols-2 gap-2.5">
                    <input type="number" step="0.1" placeholder="Weight (kg)" value={newBio.weightKg} onChange={(e) => setNewBio({ ...newBio, weightKg: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" step="0.5" placeholder="Waist (cm)" value={newBio.waistCm} onChange={(e) => setNewBio({ ...newBio, waistCm: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" placeholder="Max Pull-ups" value={newBio.maxPullups} onChange={(e) => setNewBio({ ...newBio, maxPullups: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                    <input type="number" placeholder="Max Push-ups" value={newBio.maxPushups} onChange={(e) => setNewBio({ ...newBio, maxPushups: Number(e.target.value) })} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-bold" />
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl">Save Check-In</button>
                </form>
              </div>
            )}

            {activeTab === 'setup' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                <h2 className="text-sm font-bold text-white flex justify-between">
                  <span>🧮 BMI & BMR Calculator</span>
                  <span className="text-xs text-emerald-400 font-mono">BMI: {metrics.bmi} ({metrics.bmiCategory})</span>
                </h2>
                <div className="grid grid-cols-2 gap-2.5">
                  <div><label className="text-[10px] text-slate-400 block mb-1">Age</label><input type="number" value={profile.age} onChange={(e) => setProfile({ ...profile, age: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" /></div>
                  <div><label className="text-[10px] text-slate-400 block mb-1">Gender</label><select value={profile.gender} onChange={(e) => setProfile({ ...profile, gender: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs font-bold"><option value="male">Male</option><option value="female">Female</option></select></div>
                  <div><label className="text-[10px] text-slate-400 block mb-1">Weight (kg)</label><input type="number" step="0.5" value={profile.weightKg} onChange={(e) => setProfile({ ...profile, weightKg: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" /></div>
                  <div><label className="text-[10px] text-slate-400 block mb-1">Height (cm)</label><input type="number" value={profile.heightCm} onChange={(e) => setProfile({ ...profile, heightCm: Number(e.target.value) })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-bold" /></div>
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 inset-x-0 z-30 bg-slate-900/95 border-t border-slate-800 px-2 py-2">
            <div className="max-w-lg mx-auto grid grid-cols-4 gap-1">
              {[
                { id: 'workout', label: '⚡ Workout' },
                { id: 'nutrition', label: '🍏 Nutrition' },
                { id: 'analytics', label: '📈 Progress' },
                { id: 'setup', label: '⚙️ Setup' }
              ].map((t) => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} className={`py-2 rounded-xl text-xs font-bold ${activeTab === t.id ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400'}`}>
                  {t.label}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
